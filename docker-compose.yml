version: "3.8"

services:
  # ─── TeleDrive Backend + Frontend (Turso / SQLite) ──
  teledrive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teledrive-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - teledrive-data:/app/data
    environment:
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:/app/data/teledrive.db}

volumes:
  teledrive-data:
    driver: local
