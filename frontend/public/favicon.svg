<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161420" />
      <stop offset="50%" stop-color="#0e0d14" />
      <stop offset="100%" stop-color="#08070c" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6" />
    </linearGradient>

    <!-- Emblem Glowing Gradient -->
    <linearGradient id="aetheriaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Sparkle Glow -->
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="128"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="16"
  />

  <!-- Subtle Inner Ambient Ring -->
  <rect
    x="48"
    y="48"
    width="416"
    height="416"
    rx="108"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.04"
    stroke-width="2"
  />

  <!-- Glow effect under the emblem -->
  <path
    d="M256 110 L380 390 L310 390 L285 330 L227 330 L202 390 L132 390 Z"
    fill="url(#aetheriaGrad)"
    opacity="0.4"
    filter="url(#glow)"
  />

  <!-- Central Futuristic "A" Monomark -->
  <g id="emblem">
    <!-- Left Leg -->
    <path
      d="M256 120 L136 390 L198 390 L228 320 L284 320 L256 250 Z"
      fill="url(#aetheriaGrad)"
    />

    <!-- Right Leg -->
    <path
      d="M256 120 L376 390 L314 390 L284 320 L228 320 L256 250 Z"
      fill="url(#aetheriaGrad)"
      opacity="0.9"
    />

    <!-- Central Floating Diamond / Triangle Core -->
    <polygon
      points="256,190 280,265 232,265"
      fill="#0d0d14"
    />

    <!-- Horizontal Futuristic Accent Line -->
    <rect
      x="210"
      y="300"
      width="92"
      height="14"
      rx="7"
      fill="#ffffff"
      opacity="0.95"
      filter="url(#glow)"
    />
  </g>

  <!-- Celestial Sparkle Star (Top Right) -->
  <g transform="translate(365, 120)">
    <circle cx="0" cy="0" r="32" fill="url(#sparkleGlow)" />
    <path
      d="M0 -22 Q0 0 22 0 Q0 0 0 22 Q0 0 -22 0 Q0 0 0 -22 Z"
      fill="#ffffff"
    />
  </g>

  <!-- Micro Sparkle (Bottom Left) -->
  <g transform="translate(140, 160)">
    <path
      d="M0 -10 Q0 0 10 0 Q0 0 0 10 Q0 0 -10 0 Q0 0 0 -10 Z"
      fill="#fbbf24"
      opacity="0.85"
    />
  </g>
</svg>
